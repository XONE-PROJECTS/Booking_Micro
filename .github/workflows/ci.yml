name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://booking:booking@localhost:5432/booking_test
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      ENCRYPTION_KEY: ci-encryption-key-32-characters
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration -w @universal-booking/api